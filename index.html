function styleRule(style) {

      "若受众是小学生，则改用小朋友能懂的天马行空方式抽象搞怪，不要用术语。";
  return "";
}
function audienceRule(audience) {
  if (audience === "小学生")
    return "【受众：小学生】全程用大白话和小学生熟悉的例子（零食、动画片、课间、橡皮、压岁钱、做作业等），" +

  if (audience === "烧脑")
    return "【受众：烧脑】可以大量使用学术术语、跨学科概念和抽象推理，越唬人越好，但论证依旧荒诞。";
  return "【受众：普通成年人】正常难度，雅俗共赏。";
}

function extractJson(s) {
  let t = String(s).replace(/^```json\s*/i, "").replace(/^```\s*/, "").replace(/```\s*$/, "").trim();
  const a = t.indexOf("["), za = t.lastIndexOf("]");
  const o = t.indexOf("{"), zo = t.lastIndexOf("}");
  if (a >= 0 && za > a && (o < 0 || a < o)) return t.slice(a, za + 1);
  if (o >= 0 && zo > o) return t.slice(o, zo + 1);
  return t;
}
function repairJson(s) {
  return s.replace(/[\u0000-\u001F]+/g, " ").replace(/,\s*([}\]])/g, "$1").replace(/}\s*{/g, "},{").replace(/]\s*\[/g, "],[");
}
function parseJson(raw) {
  const base = extractJson(raw);
  for (const cand of [base, repairJson(base)]) { try { return JSON.parse(cand); } catch (e) {} }
  throw new Error("PARSE_FAIL");
}

async function callAPI(system, user, maxTokens, cfg) {
  if (!cfg.apiKey) throw new Error("还没填 API Key，点右上角『API 设置』填一下");
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": cfg.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: cfg.model, max_tokens: maxTokens, system, messages: [{ role: "user", content: user }] }),
    });
  } catch (e) {
    throw new Error("连不上 Anthropic（多半是被浏览器拦了）。建议用 GitHub Pages 或本地服务器打开，详见 README。");
  }
  if (!res.ok) {
    let msg = "请求失败（" + res.status + "）";
    try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
    if (res.status === 401) msg = "API Key 不对或未授权（401）。请检查 Key。";
    if (res.status === 400 && /model/.test(msg)) msg = "这个模型你的账号用不了，换一个模型试试（400）。";
    if (res.status === 429) msg = "太频繁或额度不足（429），等一下或检查账户余额。";
    throw new Error(msg);
  }
  const data = await res.json();
  return (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("").trim();
}

async function callJSON(system, user, maxTokens, cfg) {
  let raw = await callAPI(system, user, maxTokens, cfg);
  try { return parseJson(raw); } catch (e) {}
  const retryUser = user + "\n\n注意：上一次的输出不是合法 JSON。请重新输出，务必满足：①整体是严格合法的 JSON；②文字里的引号一律用中文「」，绝不用英文双引号；③不要有多余逗号；④不要在字符串里换行。只输出 JSON 本身。";
  raw = await callAPI(system, retryUser, maxTokens, cfg);
  try { return parseJson(raw); } catch (e) { throw new Error("这次没编圆，点一下重新生成就好"); }
}

  const sys = PERSONA + "\n现在请只规划一份演讲提纲（不写正文）。";
  const usr =
    `主题：「${topic}」。风格：「${style}」。胡说程度：「${absurdity}」。\n` +
    audienceRule(audience) + "\n" + (styleRule(style) ? styleRule(style) + "\n" : "") +
    `请规划 ${count} 页内容页的提纲，返回 JSON：\n` +
    `{"title":"严肃得过分的主标题","subtitle":"伪学术副标题","presenter":"汇报人头衔（含虚构所名）","outline":[{"type":"页面类型","title":"该页标题","note":"该页要论证的荒诞要点，一句话"}]}\n` +
    `类型从 agenda/bullets/stat/chart/quote/conclusion 中选。要求：第 1 页为 agenda，最后 1 页为 conclusion，中间至少包含 2 个 chart、1 个 stat、1 个 quote，其余为 bullets。整套提纲要有层层递进的荒诞主线。`;
  const meta = await callJSON(sys, usr, 1600, cfg);
  if (!meta || !Array.isArray(meta.outline)) throw new Error("提纲生成失败，再试一次");
  return meta;
}

async function generateBatch({ topic, style, absurdity, audience, meta, outline, start, slice, cfg }) {
  const sys = PERSONA;
  const outlineText = outline.map((o, i) => `${i + 1}. [${o.type}] ${o.title} — ${o.note || ""}`).join("\n");
  const usr =
    `主题：「${topic}」。风格：「${style}」。胡说程度：「${absurdity}」。演讲标题：《${meta.title}》。\n` +
    audienceRule(audience) + "\n" + (styleRule(style) ? styleRule(style) + "\n" : "") +
    `完整提纲如下：\n${outlineText}\n\n` +
    `现在请只写第 ${start + 1} 到 ${start + slice.length} 页的完整内容，严格按各页的 type 和要点展开。\n` +
    `${SCHEMA}\n` +
    `chart 的 data 给 4-6 项且数字有起伏；文字精炼，每条不超过 30 字。\n` +
    `只输出这 ${slice.length} 页，返回一个 JSON 数组，每个元素是一页完整对象，顺序与提纲一致。`;
  const arr = await callJSON(sys, usr, 1600, cfg);
  const list = Array.isArray(arr) ? arr : (arr.slides || [arr]);
  return slice.map((o, j) => {
    const got = list[j];
    if (got && got.type) return got;
    return { type: o.type || "bullets", title: o.title, bullets: ["（本页生成异常，点重新生成可重试）"] };
  });
}

async function generateDeck({ topic, style, absurdity, audience, count, cfg, onProgress }) {
  onProgress({ label: "正在拟定演讲提纲…", pct: 8 });
  const meta = await generateOutline({ topic, style, absurdity, audience, count, cfg });
  const outline = meta.outline.slice(0, count);
  const BATCH = 4;
  const slides = [];
  for (let i = 0; i < outline.length; i += BATCH) {
    const slice = outline.slice(i, i + BATCH);
    const end = Math.min(i + BATCH, outline.length);
    onProgress({ label: `正在编造第 ${i + 1}–${end} 页…`, pct: 12 + Math.round((i / outline.length) * 82) });
    let part;
    try { part = await generateBatch({ topic, style, absurdity, audience, meta, outline, start: i, slice, cfg }); }
    catch (e) { part = slice.map((o) => ({ type: o.type || "bullets", title: o.title || "本页", bullets: ["（这一页没编圆，可重新生成整套）"] })); }
    slides.push(...part);
  }
  onProgress({ label: "正在加盖公章…", pct: 98 });
  return { title: meta.title, subtitle: meta.subtitle, presenter: meta.presenter, slides };
}

function Stat({ slide, index, total }) {

    <SlideFrame index={index} total={total}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: "clamp(8px,1.4vw,16px)" }}>
        <div style={{ fontFamily: "serif", fontWeight: 700, color: C.seal, fontSize: "clamp(54px,12vw,140px)", lineHeight: 0.95 }}>{slide.stat}</div>

function ChartSlide({ slide, index, total }) {
  const data = (slide.data || []).map((d) => ({ name: String(d.name), value: Number(d.value) || 0 }));
  const type = slide.chartType || "bar";
  const ok = ResponsiveContainer && BarChart;
  return (
    <SlideFrame index={index} total={total} footerNote={slide.source || "（数据来源：本院自行编造）"}>
      <SlideTitle>{slide.title}</SlideTitle>
      <div style={{ flex: 1, minHeight: 0, display: "flex", gap: 20, alignItems: "stretch" }}>
        <div style={{ flex: 1, minHeight: 140 }}>
          {ok ? (
            <ResponsiveContainer width="100%" height="100%">
              {type === "line" ? (
                <LineChart data={data} margin={{ top: 8, right: 16, bottom: 4, left: -8 }}>
                  <CartesianGrid stroke={C.line} strokeDasharray="3 3" vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 11, fill: C.muted }} axisLine={{ stroke: C.line }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: C.muted }} axisLine={false} tickLine={false} />
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${C.line}` }} />
                  <Line type="monotone" dataKey="value" stroke={C.seal} strokeWidth={2.5} dot={{ r: 3, fill: C.seal }} />
                </LineChart>
              ) : type === "pie" ? (
                <PieChart>
                  <Pie data={data} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius="78%" label={{ fontSize: 11 }}>
                    {data.map((_, i) => <Cell key={i} fill={CHART_COLORS[i % CHART_COLORS.length]} />)}
                  </Pie>
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${C.line}` }} />
                </PieChart>
              ) : (
                <BarChart data={data} margin={{ top: 8, right: 16, bottom: 4, left: -8 }}>
                  <CartesianGrid stroke={C.line} strokeDasharray="3 3" vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 11, fill: C.muted }} axisLine={{ stroke: C.line }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: C.muted }} axisLine={false} tickLine={false} />
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${C.line}` }} cursor={{ fill: "rgba(46,90,136,0.06)" }} />
                  <Bar dataKey="value" radius={[4, 4, 0, 0]}>
                    {data.map((_, i) => <Cell key={i} fill={CHART_COLORS[i % CHART_COLORS.length]} />)}
                  </Bar>
                </BarChart>
              )}
            </ResponsiveContainer>
          ) : (
            <div style={{ color: C.muted, fontSize: 13 }}>（图表组件未加载）</div>
          )}
        </div>
        {slide.insight && (
          <div style={{ width: "30%", minWidth: 120, borderLeft: `2px solid ${C.gold}`, paddingLeft: 14, display: "flex", alignItems: "center" }}>
            <p style={{ fontSize: "clamp(11px,1.5vw,17px)", color: C.ink, lineHeight: 1.5, margin: 0 }}>
              <span style={{ color: C.gold, fontWeight: 700, display: "block", fontSize: "0.85em", letterSpacing: "0.1em", marginBottom: 6 }}>关键洞察</span>
              {slide.insight}
            </p>
          </div>
        )}
      </div>
    </SlideFrame>
  );
}

        <p style={{ fontSize: "clamp(12px,1.6vw,18px)", color: C.blue, margin: 0, fontWeight: 600 }}>{slide.attrib}</p>

          <div key={i} style={{ display: "flex", gap: 14, alignItems: "flex-start" }}>

function Thanks({ index, total }) {
  return (
    <SlideFrame index={index} total={total} eyebrow="胡言研究院" footerNote="如有雷同，纯属巧合；如觉有理，纯属错觉">
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 14 }}>
        <h2 style={{ fontFamily: "serif", fontSize: "clamp(34px,6vw,72px)", margin: 0, color: C.ink }}>谢 谢 聆 听</h2>
        <p style={{ color: C.muted, fontSize: "clamp(12px,1.6vw,18px)", margin: 0 }}>欢迎提问，本院保证答非所问</p>
      </div>
    </SlideFrame>
  );
}
function renderSlide(slide, index, total, deck) {
  const c = { slide, index, total };
  switch (slide.type) {
    case "cover": return <Cover deck={deck} index={index} total={total} />;
    case "agenda": return <Agenda {...c} />;
    case "stat": return <Stat {...c} />;
    case "chart": return <ChartSlide {...c} />;
    case "quote": return <Quote {...c} />;
    case "conclusion": return <Conclusion {...c} />;
    case "thanks": return <Thanks index={index} total={total} />;
    default: return <Bullets {...c} />;
  }
}

/* ================= 主应用 ================= */
function App() {
  const [mode, setMode] = useState("make");
  const [topic, setTopic] = useState("");
  const [style, setStyle] = useState("学术研讨");
  const [absurdity, setAbsurdity] = useState("一本正经的胡说");
  const [audience, setAudience] = useState("大众");
  const [count, setCount] = useState(12);

  const [apiKey, setApiKey] = useState("");
  const [model, setModel] = useState("claude-sonnet-4-6");
  const [showSettings, setShowSettings] = useState(false);

  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ label: "", pct: 0 });
  const [loadLine, setLoadLine] = useState(LOADING_LINES[0]);
  const [error, setError] = useState("");
  const [deck, setDeck] = useState(null);
  const [cur, setCur] = useState(0);
  const [present, setPresent] = useState(false);
  const [copied, setCopied] = useState(false);

  // 读取/保存 Key 与模型（仅存在本浏览器）
  useEffect(() => {
    try {
      const k = localStorage.getItem("huyan_key"); if (k) setApiKey(k);
      const m = localStorage.getItem("huyan_model"); if (m) setModel(m);
      if (!k) setShowSettings(true);
    } catch (e) {}
  }, []);
  useEffect(() => { try { localStorage.setItem("huyan_key", apiKey); } catch (e) {} }, [apiKey]);
  useEffect(() => { try { localStorage.setItem("huyan_model", model); } catch (e) {} }, [model]);

  const slides = deck ? [{ type: "cover" }, ...deck.slides, { type: "thanks" }] : [];
  const total = slides.length;

  useEffect(() => {
    if (!loading) return;
    let i = 0;
    const t = setInterval(() => { i = (i + 1) % LOADING_LINES.length; setLoadLine(LOADING_LINES[i]); }, 1100);
    return () => clearInterval(t);
  }, [loading]);

  const run = useCallback(async () => {
    const t = topic.trim();
    if (!apiKey.trim()) { setShowSettings(true); setError("先在『API 设置』里填入你的 Key"); return; }
    if (!t) { setError("先给我一个主题"); return; }
    setError(""); setLoading(true); setDeck(null); setProgress({ label: "准备中…", pct: 2 });
    try {
      const d = await generateDeck({ topic: t, style, absurdity, audience, count, cfg: { apiKey: apiKey.trim(), model }, onProgress: setProgress });
      setProgress({ label: "完成", pct: 100 });
      setDeck(d); setCur(0);
    } catch (e) { setError(e.message || "出了点问题，再试一次"); }
    finally { setLoading(false); }
  }, [topic, style, absurdity, audience, count, apiKey, model]);

  const go = useCallback((dir) => setCur((c) => Math.min(total - 1, Math.max(0, c + dir))), [total]);

  useEffect(() => {
    const onKey = (e) => {
      if (!deck) return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "Escape") setPresent(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [deck, go]);

  const copyScript = () => {
    if (!deck) return;
    const lines = [`《${deck.title}》`, deck.subtitle || "", deck.presenter || "", ""];
    deck.slides.forEach((s, i) => {
      lines.push(`— 第 ${i + 1} 页 —`);
      if (s.title) lines.push(s.title);
      (s.items || s.bullets || s.points || []).forEach((x) => lines.push("· " + x));
      if (s.stat) lines.push(`${s.stat} ｜ ${s.label || ""}`);
      if (s.quote) lines.push(`“${s.quote}” ${s.attrib || ""}`);
      if (s.insight) lines.push("洞察：" + s.insight);
      lines.push("");
    });
    navigator.clipboard && navigator.clipboard.writeText(lines.join("\n")).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  };

  if (present && deck) {
    return (
      <div style={{ position: "fixed", inset: 0, background: C.ink, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, zIndex: 50 }}
        onClick={(e) => { const w = e.currentTarget.clientWidth; (e.clientX > w / 2 ? go(1) : go(-1)); }}>
        <div style={{ width: "min(1100px, 96vw)" }}>{renderSlide(slides[cur], cur + 1, total, deck)}</div>
        <div style={{ position: "fixed", top: 16, right: 16 }} onClick={(e) => e.stopPropagation()}>
          <button onClick={() => setPresent(false)} style={ghostBtn}>退出放映 (Esc)</button>
        </div>
        <div style={{ position: "fixed", bottom: 16, color: "rgba(255,255,255,0.6)", fontSize: 12 }}>点击左/右半屏翻页 · {cur + 1}/{total}</div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif" }}>
      <div style={{ maxWidth: 1080, margin: "0 auto", padding: "clamp(20px,4vw,48px) clamp(16px,4vw,32px)" }}>

        <header style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 6 }}>
          <Seal />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, letterSpacing: "0.22em", color: C.blue, fontWeight: 700 }}>胡 言 研 究 院</div>
            <h1 style={{ fontFamily: "serif", fontSize: "clamp(24px,4vw,40px)", margin: "2px 0 0", lineHeight: 1.1 }}>整活演讲生成系统</h1>
          </div>
          <button onClick={() => setShowSettings((s) => !s)} style={ghostBtnLight}>⚙ API 设置</button>
        </header>
        <p style={{ color: C.muted, fontSize: "clamp(12px,1.5vw,15px)", margin: "8px 0 20px", maxWidth: 580 }}>
          给一个主题，现场编一套一本正经胡说八道的幻灯片：假数据、假图表、假引用。可生成十几页并全屏放映直接开讲。
        </p>

        {showSettings && (
          <div style={{ background: "#FFF8F0", border: `1px solid ${C.gold}`, borderRadius: 12, padding: 18, marginBottom: 20 }}>
            <div style={{ fontWeight: 700, marginBottom: 8 }}>API 设置（只存在你自己的浏览器里）</div>
            <label style={lbl}>Anthropic API Key</label>
            <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="sk-ant-..."
              style={{ width: "100%", marginTop: 6, padding: "10px 12px", fontSize: 14, border: `1px solid ${C.line}`, borderRadius: 8, outline: "none" }} />
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}>
              <label style={lbl}>模型</label>
              <select value={model} onChange={(e) => setModel(e.target.value)} style={{ padding: "8px 10px", fontSize: 14, border: `1px solid ${C.line}`, borderRadius: 8 }}>
                {MODELS.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 10, lineHeight: 1.6 }}>
              在 console.anthropic.com 申请 Key。Key 只保存在本机浏览器，不会上传，也不要把它写进代码提交到 GitHub。每次生成会消耗少量 API 额度。
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
          <button onClick={() => setMode("make")} style={tab(mode === "make")}>生成幻灯片</button>
          <button onClick={() => setMode("draw")} style={tab(mode === "draw")}>现场抽题</button>
        </div>

        {mode === "draw" && <DrawMode audience={audience} setAudience={setAudience} onUse={(t) => { setTopic(t); setMode("make"); }} />}

        {mode === "make" && (
          <React.Fragment>
            <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "clamp(16px,3vw,28px)" }}>
              <label style={lbl}>演讲主题</label>
              <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                <input value={topic} onChange={(e) => setTopic(e.target.value)} onKeyDown={(e) => e.key === "Enter" && run()}
                  placeholder="比如：论袜子失踪与暗物质的关系"
                  style={{ flex: 1, minWidth: 220, padding: "12px 14px", fontSize: 15, border: `1px solid ${C.line}`, borderRadius: 10, outline: "none", background: C.white, color: C.ink }} />
                <button onClick={() => setTopic(randomTopic(audience))} style={ghostBtnLight}>随机选题</button>
              </div>
              <div style={{ display: "flex", gap: 22, flexWrap: "wrap", marginTop: 20 }}>
                <div><label style={lbl}>风格</label><div style={chipRow}>{STYLES.map((s) => <button key={s.id} onClick={() => setStyle(s.id)} title={s.hint} style={chip(style === s.id)}>{s.label}</button>)}</div></div>
                <div><label style={lbl}>胡说程度</label><div style={chipRow}>{ABSURDITY.map((a) => <button key={a.id} onClick={() => setAbsurdity(a.id)} style={chip(absurdity === a.id)}>{a.label}</button>)}</div></div>
                <div><label style={lbl}>受众难度</label><div style={chipRow}>{AUDIENCE.map((a) => <button key={a.id} onClick={() => setAudience(a.id)} title={a.hint} style={chip(audience === a.id)}>{a.label}</button>)}</div></div>
                <div><label style={lbl}>内容页数</label><div style={chipRow}>{PAGE_COUNTS.map((n) => <button key={n} onClick={() => setCount(n)} style={chip(count === n)}>{n} 页</button>)}</div></div>
              </div>
              <button onClick={run} disabled={loading} style={{ ...primaryBtn, marginTop: 24, opacity: loading ? 0.7 : 1 }}>{loading ? "正在编造…" : `生成 ${count} 页幻灯片`}</button>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 10 }}>页数越多，分批生成耗时越长，请耐心等公章盖完。</div>
              {error && <div style={{ color: C.seal, fontSize: 13, marginTop: 12 }}>{error}</div>}
            </div>
            {loading && (
              <div style={{ textAlign: "center", padding: "36px 0", color: C.muted }}>
                <div style={{ fontFamily: "serif", fontSize: 18, color: C.ink }}>{loadLine}</div>
                <div style={{ margin: "16px auto 0", maxWidth: 360, height: 8, background: C.line, borderRadius: 999, overflow: "hidden" }}>
                  <div style={{ width: `${progress.pct}%`, height: "100%", background: C.seal, transition: "width .4s" }} />
                </div>
                <div style={{ fontSize: 12, marginTop: 8 }}>{progress.label}（{progress.pct}%）</div>
              </div>
            )}
          </React.Fragment>
        )}

        {deck && !loading && (
          <div style={{ marginTop: 32 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={() => setPresent(true)} style={primaryBtnSm}>▶ 全屏放映</button>
                <button onClick={copyScript} style={ghostBtnLight}>{copied ? "已复制 ✓" : "复制讲稿"}</button>
                <button onClick={run} style={ghostBtnLight}>↻ 重新生成</button>
              </div>
              <div style={{ color: C.muted, fontSize: 13 }}>{cur + 1} / {total}</div>
            </div>
            <div style={{ position: "relative" }}>
              {renderSlide(slides[cur], cur + 1, total, deck)}
              <button onClick={() => go(-1)} disabled={cur === 0} style={{ ...navArrow, left: -6, opacity: cur === 0 ? 0.25 : 1 }}>‹</button>
              <button onClick={() => go(1)} disabled={cur === total - 1} style={{ ...navArrow, right: -6, opacity: cur === total - 1 ? 0.25 : 1 }}>›</button>
            </div>
            <div style={{ display: "flex", gap: 6, justifyContent: "center", marginTop: 16, flexWrap: "wrap" }}>
              {slides.map((_, i) => (
                <button key={i} onClick={() => setCur(i)} style={{ width: cur === i ? 22 : 8, height: 8, borderRadius: 4, border: "none", cursor: "pointer", background: cur === i ? C.seal : C.line, transition: "all .2s" }} />
              ))}
            </div>
          </div>
        )}

        <footer style={{ marginTop: 48, paddingTop: 16, borderTop: `1px solid ${C.line}`, color: C.muted, fontSize: 12, textAlign: "center" }}>
          胡言研究院 · 所有数据、引用、结论均为现场编造，仅供娱乐
        </footer>
      </div>
    </div>
  );
}

function DrawMode({ onUse, audience, setAudience }) {
  const [current, setCurrent] = useState("点下方按钮，抽取一个主题");
  const [rolling, setRolling] = useState(false);
  const [dur, setDur] = useState(90);
  const [left, setLeft] = useState(90);
  const [running, setRunning] = useState(false);
  const timer = useRef(null);
  const roll = useRef(null);
  const audRef = useRef(audience);
  useEffect(() => { audRef.current = audience; }, [audience]);
  useEffect(() => () => { clearInterval(timer.current); clearInterval(roll.current); }, []);
  useEffect(() => { if (!running) setLeft(dur); }, [dur, running]);

  const spin = () => {
    clearInterval(roll.current); setRolling(true);
    let n = 0;
    roll.current = setInterval(() => { setCurrent(drawTopic(audRef.current)); if (++n > 12) { clearInterval(roll.current); setRolling(false); } }, 70);
  };
  const startTimer = () => {
    if (running) { clearInterval(timer.current); setRunning(false); return; }
    setRunning(true);
    timer.current = setInterval(() => { setLeft((s) => { if (s <= 1) { clearInterval(timer.current); setRunning(false); return 0; } return s - 1; }); }, 1000);
  };
  const resetTimer = () => { clearInterval(timer.current); setRunning(false); setLeft(dur); };
  const mm = String(Math.floor(left / 60)).padStart(2, "0");
  const ss = String(left % 60).padStart(2, "0");
  const danger = left <= 10 && running;

  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "clamp(20px,4vw,40px)", textAlign: "center" }}>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 11, letterSpacing: "0.2em", color: C.muted, fontWeight: 700, marginBottom: 8 }}>难 度</div>
        <div style={{ display: "flex", gap: 6, justifyContent: "center", flexWrap: "wrap" }}>
          {AUDIENCE.map((a) => <button key={a.id} onClick={() => setAudience(a.id)} title={a.hint} style={chip(audience === a.id)}>{a.label}</button>)}
        </div>
      </div>
      <div style={{ fontSize: 11, letterSpacing: "0.2em", color: C.blue, fontWeight: 700 }}>本 轮 题 目</div>
      <div style={{ fontFamily: "serif", fontSize: "clamp(22px,4vw,40px)", color: rolling ? C.muted : C.ink, margin: "16px 0 8px", lineHeight: 1.25, minHeight: "2em", display: "flex", alignItems: "center", justifyContent: "center" }}>{current}</div>
      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", marginTop: 12 }}>
        <button onClick={spin} disabled={rolling} style={{ ...primaryBtn, width: "auto", padding: "12px 28px" }}>{rolling ? "抽取中…" : "🎲 抽取主题"}</button>
        <button onClick={() => onUse(current)} disabled={rolling || current.startsWith("点")} style={ghostBtnLight}>用这个生成 PPT →</button>
      </div>
      <div style={{ marginTop: 32, borderTop: `1px solid ${C.line}`, paddingTop: 24 }}>
        <div style={{ fontSize: 11, letterSpacing: "0.2em", color: C.blue, fontWeight: 700, marginBottom: 14 }}>即 兴 计 时</div>
        <div style={{ fontFamily: "serif", fontSize: "clamp(44px,10vw,84px)", fontWeight: 700, color: danger ? C.seal : C.ink, lineHeight: 1 }}>{mm}:{ss}</div>
        <div style={{ display: "flex", gap: 6, justifyContent: "center", marginTop: 16, flexWrap: "wrap" }}>
          {[60, 90, 120].map((d) => <button key={d} onClick={() => setDur(d)} disabled={running} style={chip(dur === d)}>{d}s</button>)}
        </div>
        <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 14 }}>
          <button onClick={startTimer} style={{ ...primaryBtnSm, background: running ? C.blue : C.seal }}>{running ? "暂停" : "开始"}</button>
          <button onClick={resetTimer} style={ghostBtnLight}>重置</button>
        </div>
        {left === 0 && <div style={{ color: C.seal, fontWeight: 700, marginTop: 14, fontSize: 18 }}>⏰ 时间到！</div>}
      </div>
    </div>
  );
}

/* ================= 样式 ================= */
const lbl = { fontSize: 11, letterSpacing: "0.14em", color: C.muted, fontWeight: 700, textTransform: "uppercase" };
const chipRow = { display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" };
const chip = (a) => ({ padding: "7px 13px", fontSize: 13, borderRadius: 999, cursor: "pointer", border: `1px solid ${a ? C.ink : C.line}`, background: a ? C.ink : C.white, color: a ? C.white : C.ink });
const tab = (a) => ({ padding: "9px 18px", fontSize: 14, fontWeight: 700, borderRadius: 999, cursor: "pointer", border: `1px solid ${a ? C.ink : C.line}`, background: a ? C.ink : "transparent", color: a ? C.white : C.muted });
const primaryBtn = { width: "100%", padding: "13px", fontSize: 15, fontWeight: 700, color: C.white, background: C.seal, border: "none", borderRadius: 10, cursor: "pointer" };
const primaryBtnSm = { padding: "9px 16px", fontSize: 14, fontWeight: 700, color: C.white, background: C.seal, border: "none", borderRadius: 8, cursor: "pointer" };
const ghostBtnLight = { padding: "9px 14px", fontSize: 14, color: C.ink, background: C.white, border: `1px solid ${C.line}`, borderRadius: 8, cursor: "pointer" };
const ghostBtn = { padding: "9px 14px", fontSize: 13, color: C.white, background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 8, cursor: "pointer" };
const navArrow = { position: "absolute", top: "50%", transform: "translateY(-50%)", width: 40, height: 40, borderRadius: "50%", border: `1px solid ${C.line}`, background: C.white, color: C.ink, fontSize: 22, cursor: "pointer", boxShadow: "0 4px 12px rgba(0,0,0,0.1)", lineHeight: 1 };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
